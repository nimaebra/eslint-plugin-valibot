name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify
        run: |
          pnpm security:audit
          pnpm check
          pnpm smoke:pack -- --eslint-version 9 --valibot-version 1.0.0
          pnpm smoke:pack -- --eslint-version 9 --valibot-version latest
          pnpm smoke:pack -- --valibot-version 1.0.0
          pnpm smoke:pack -- --valibot-version latest
          pnpm pack:dry-run

      - name: Create version PR or publish
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release:publish
          commit-message: 'chore(release): release packages'
          pr-title: 'chore(release): release packages'
        env:
          NPM_CONFIG_PROVENANCE: true
