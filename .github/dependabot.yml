version: 2

updates:
  - package-ecosystem: npm
    directory: /
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Keep Node types aligned with the oldest supported Node version
      # (engines: ^22.13.0 || >=24.0.0) so newer-only APIs fail typecheck.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: ci
      include: scope
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
